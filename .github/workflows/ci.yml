# Runs every quality gate on each push and pull request. A red build blocks merging into main.
# Pushes to main run it through the deploy workflow, which calls it before publishing.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run check-levels
      - run: npm run build
      # The built JavaScript and the assets within their budget (plan 06, phase 11).
      - run: npm run budget
