<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florecer</title>
    <style>
      /* The pixel font of the game (monogram extended, CC0); the game starts once it is loaded. */
      @font-face {
        font-family: 'monogram';
        src: url('/assets/fonts/monogram-extended.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #141b1b;
      }
      /* As tall as the window and a block of its own, so Phaser centres the canvas in it, also when
         the canvas is a zoom smaller to leave room for the teacher's panel at its right. */
      body {
        min-height: 100vh;
        display: flow-root;
      }
      /* A block, so no text baseline makes the page taller than a canvas that fits the window. */
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
