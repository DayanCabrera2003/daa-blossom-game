<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, the description and the words without script are written from the locale when
         the game is built and served (tools/page/pageTexts.ts, through vite.config.ts). -->
    <title></title>
    <!-- The page's icon: a sprout of grass from Ninja Adventure (CC0), credited in CREDITS.md. -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <!-- The pixel font starts downloading with the page, not once the script asks for it. -->
    <link
      rel="preload"
      href="/assets/fonts/monogram-extended.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      /* The pixel font of the game (monogram extended, CC0); the game starts once it is loaded. */
      @font-face {
        font-family: 'monogram';
        src: url('/assets/fonts/monogram-extended.ttf') format('truetype');
        font-display: block;
      }
      /* Under a finger, the page zooms on no double tap (a pinch still zooms), never bounces past
         its ends, and a phone turned sideways never inflates the books' text. */
      html,
      body {
        margin: 0;
        background: #141b1b;
        touch-action: manipulation;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* As tall as the window and a block of its own, so Phaser centres the canvas in it, also when
         the canvas is a zoom smaller to leave room for the teacher's panel at its right. On a phone,
         as tall as what its bars leave of the window. */
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flow-root;
      }
      /* A block, so no text baseline makes the page taller than a canvas that fits the window. Every
         touch on it is the game's: no scrolling, no zoom, no selection, no callout, no tap flash. */
      canvas {
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Before the script arrives, a lantern drawn in CSS beats on the dark page, with no text: its
         light and its edge are the tones of the canvas's loading bar (game/picture/loadingBar.ts),
         and it stands at the centre of the window, as the canvas and its bar do, so the bar takes
         over in its place when the preload scene draws it and this goes (ui/pageLoader.ts). Its
         pixel is about the canvas's: a whole CSS pixel where the browser can round one. */
      #page-loader {
        --pixel: max(1px, min(100vw / 480, 100vh / 270));
        position: fixed;
        left: 50%;
        top: 50%;
        box-sizing: border-box;
        width: calc(8 * var(--pixel));
        height: calc(10 * var(--pixel));
        transform: translate(-50%, -50%);
        background: #ef914f;
        border: var(--pixel) solid #543c52;
        animation: page-loader-beat 1.2s ease-in-out infinite alternate;
      }
      @supports (width: round(down, 1.5px, 1px)) {
        #page-loader {
          --pixel: max(1px, round(down, min(100vw / 480, 100vh / 270), 1px));
        }
      }
      /* Its cap, in the colour of its edge. */
      #page-loader::before {
        content: '';
        position: absolute;
        left: calc(1 * var(--pixel));
        top: calc(-3 * var(--pixel));
        width: calc(4 * var(--pixel));
        height: calc(2 * var(--pixel));
        background: #543c52;
      }
      /* The beat: from the lantern's light to its pale glow and back. */
      @keyframes page-loader-beat {
        to {
          background: #ffe18d;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #page-loader {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
